# 3. CONTROLADOR MDB MOCK
class MDBControllerMock:
    def __init__(self, port='/dev/ttyUSB0'):
        self.port = port
        self.simular_moeda_proxima_leitura = Decimal("0.00")
        
    def conectar(self):
        logger.info(f"🔌 Conectado à porta serial: {self.port}")
        
    def verificar_moedas(self) -> Decimal:
        if self.simular_moeda_proxima_leitura > 0:
            valor = self.simular_moeda_proxima_leitura
            self.simular_moeda_proxima_leitura = Decimal("0.00")
            return valor
        return Decimal("0.00")

mdb = MDBControllerMock(port='/dev/ttyUSB0')

saldo_atual = Decimal("0.00")
stock_coca_cola = 3
modo_manutencao = False

