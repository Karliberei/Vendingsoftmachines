        self.venda_solicitada = False

    def simular_moeda(self):
        if not modo_manutencao:
            mdb.simular_moeda_proxima_leitura = Decimal("0.50")
        else:
            logger.warning("⚠️ Máquina em manutenção. Não aceita moedas.")

    def trigger_venda(self):
        if not modo_manutencao:
            self.venda_solicitada = True
        else:
            logger.warning("⚠️ Venda bloqueada: Máquina em manutenção.")

    def toggle_manutencao(self):
        global modo_manutencao
        modo_manutencao = not modo_manutencao
        cor = "#ffc107" if modo_manutencao else "#444444"
        self.luz_manut_canvas.itemconfig(self.luz_manut, fill=cor)
        logger.info(f"🔧 Modo manutenção alterado para: {'ATIVADO' if modo_manutencao else 'DESATIVADO'}")

    def atualizar_saldo_tela(self, valor: Decimal):
        self.label_saldo.config(text=f"{valor:.2f}€")

    def atualizar_botao_stock(self):
        self.btn_venda.config(text=f"🛒 Comprar Coca-Cola (1.50€) [Qtd: {stock_coca_cola}]")

    def piscar_luz_mdb(self):
        self.luz_mdb_canvas.itemconfig(self.luz_mdb, fill="#007bff")
        self.root.after(150, lambda: self.luz_mdb_canvas.itemconfig(self.luz_mdb, fill="#00ff00"))

    def set_luz_telemetria(self, estado: str):
        cor = "#444444"
        if estado == "ENVIANDO": cor = "#ffc107"
        elif estado == "SUCESSO": cor = "#00ff00"
        elif estado == "ERRO": cor = "#dc3545"
        self.luz_net_canvas.itemconfig(self.luz_net, fill=cor)

    def set_luz_stock(self, ativo: bool):
        cor = "#dc3545" if ativo else "#444444"
        self.luz_stock_canvas.itemconfig(self.luz_stock, fill=cor)

    async def updater_loop(self):
        try:
            while True:
                self.root.update()
                await asyncio.sleep(0.02)
        except tk.TclError:
            asyncio.get_running_loop().stop()

ui = VendingDashboard()

tkinter_handler = TkinterLogHandler(ui.log_text)
tkinter_handler.setFormatter(formatter)
logger.addHandler(tkinter_handler)

mdb.conectar()

def _sync_send_telemetry(payload: dict):
    ui.root.after(0, lambda: ui.set_luz_telemetria("ENVIANDO"))
    logger.info(f"📡 Nuvem: A tentar enviar evento {payload.get('event_type')}...")
    
    data = json.dumps(payload).encode('utf-8')
    req = urllib.request.Request(TELEMETRY_ENDPOINT, data=data, headers={'Content-Type': 'application/json'}, method='POST')
    try:
        with urllib.request.urlopen(req, timeout=3.0) as response:
            status_code = response.getcode()
            if status_code in:
                logger.info(f"📊 Nuvem: Telemetria enviada com sucesso!")
                ui.root.after(0, lambda: ui.set_luz_telemetria("SUCESSO"))
            else:
                logger.error(f"⚠️ Nuvem: Servidor recusou dados (Status {status_code}).")
                ui.root.after(0, lambda: ui.set_luz_telemetria("ERRO"))
    except Exception as e:
        logger.error(f"❌ Nuvem: Erro na ligação à rede.")
        ui.root.after(0, lambda: ui.set_luz_telemetria("ERRO"))

async def send_telemetry_event(payload: dict):
    loop = asyncio.get_running_loop()
    loop.run_in_executor(None, _sync_send_telemetry, payload)

async def report_sale_to_cloud(machine_id: str, code: str, name: str, price: Decimal):
    payload = {
        "machine_id": machine_id, "event_type": "SALE", "timestamp": datetime.now(timezone.utc).isoformat(),
        "data": {"slot": code, "product_name": name, "amount_paid": str(price)}
    }
    await send_telemetry_event(payload)

