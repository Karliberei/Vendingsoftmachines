# 1. CONFIGURAÇÃO DO EMISSOR DE LOGS PERSONALIZADO PARA O TKINTER
class TkinterLogHandler(logging.Handler):
    """Redireciona os logs do Python diretamente para o componente de texto da UI."""
    def __init__(self, text_widget):
        super().__init__()
        self.text_widget = text_widget

    def emit(self, record):
        msg = self.format(record)
        def append_msg():
            self.text_widget.configure(state='normal')
            self.text_widget.insert(tk.END, msg + '\n')
            self.text_widget.configure(state='disabled')
            self.text_widget.yview(tk.END) # Auto-scroll para o fim
        self.text_widget.after(0, append_msg)

# Configuração Base do Logger
logger = logging.getLogger("VendingMachine")
logger.setLevel(logging.INFO)
formatter = logging.Formatter("%(asctime)s - %(levelname)s - %(message)s", "%H:%M:%S")

